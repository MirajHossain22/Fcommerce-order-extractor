services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_PATH: /data/orders.sqlite3
      FORWARDED_ALLOW_IPS: 127.0.0.1
      SELLER_API_KEYS: ${SELLER_API_KEYS:?Set SELLER_API_KEYS to a JSON seller-key mapping}
    volumes:
      - order-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  order-data:
